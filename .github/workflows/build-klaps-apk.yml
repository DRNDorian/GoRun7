name: Build KLAPS APK

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          cat klaps-payload/part-*.txt | base64 -d > /tmp/klaps.zip
          unzip -q /tmp/klaps.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: klaps_android
        run: gradle --no-daemon assembleDebug

      - name: Prepare artifact
        run: cp klaps_android/app/build/outputs/apk/debug/app-debug.apk KLAPS-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KLAPS-debug-apk
          path: KLAPS-debug.apk
          retention-days: 7
