name: KLAPS Smoke Test

on:
  pull_request:
    branches: [master]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Create result
        shell: bash
        run: |
          echo "GitHub Actions runner works" > smoke.txt
          uname -a >> smoke.txt
          java -version >> smoke.txt 2>&1 || true
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: klaps-smoke
          path: smoke.txt
